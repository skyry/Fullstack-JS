    <form class="formRegistration">
        <fieldset>
          <legend>Особиста інформація</legend>
          <div>
            <label for="name">Ім'я:</label> 
            <input type="text" id="name" name="name">
            <label for="surname">Фамілія:</label> 
            <input type="text" id="surname" name="surname">
          </div>
          <div>
            <label>Стать:</label>
            <input type="radio" name="gender" value="male"> Чоловік
            <input type="radio" name="gender" value="female"> Жінка
          </div>
          <div>
            <label>Дата народження:</label>
            <input type="date" name="birthday">
            <label for="age">Скільки Вам років:</label> 
            <input type="number" id="age" name="age">
          </div>
          <div>
            <label for="email">Електронна пошта:</label>
            <input type="email" id="email" name="email">
          </div>
        </fieldset>
      
        <fieldset>
            <legend>Ваші уподобання:</legend>
            <div>
             <input type="checkbox" name="movie" value="movie"> Фільми
             <input type="checkbox" name="music" value="music"> Музика
             <input type="checkbox" name="books" value="books"> Книги
             <input type="checkbox" name="games" value="games"> Ігри
            </div>
            <div>
             <label for="from">Звідки ви про нас дізнались:</label>
             <select id="from" name="from">
              <option value="google">google</option>
              <option value="facebook">facebook</option>
              <option value="telegram">telegram</option>
             </select>
            </div>
          </fieldset>
        <button type="submit">Надіслати</button>
        <button type="reset">Скинути</button>
      </form>
</body>
